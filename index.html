async function load(){if(LOCAL_MODE){try{const raw=localStorage.getItem('daftar-data-v1');if(raw)data=JSON.parse(raw);ready=true;render()}catch(e){toast('دسترسی به ذخیره دستگاه ممکن نیست. مرورگر را در حالت عادی باز کن.')}return}try{const r=await fetch('/api/state');if(!r.ok)throw Error('دریافت اطلاعات ممکن نشد؛ برای ورود یا تلاش دوباره صفحه را تازه کنید.');const j=await r.json();data=j.data;revision=j.revision;ready=true;render()}catch(e){toast(e.message);render()}}
async function commit(next,message){if(!ready||saving){toast('لطفاً تا آماده شدن ذخیره‌سازی صبر کنید.');return false}if(LOCAL_MODE){try{localStorage.setItem('daftar-data-v1',JSON.stringify(next));data=next;if(message)toast(message);render();return true}catch(e){toast('ذخیره نشد؛ فضای مرورگر را بررسی کن و خروجی بگیر.');return false}}if(previewMode){toast('پیش‌نمایش فقط برای بررسی رابط است؛ ثبت اطلاعات در سایت منتشرشده فعال می‌شود.');return false}saving=true;renderStatus();try{const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:next,revision})});const j=await r.json();if(!r.ok)throw Error(j.error);data=next;revision=j.revision;if(message)toast(message);render();return true}catch(e){toast(e.message||'ذخیره نشد؛ دوباره تلاش کنید.');return false}finally{saving=false;renderStatus()}}

,more('tasks'))}${card('منتظر دیگران',open.filter(r=>r.status==='منتظر دیگران').length?open.filter(r=>r.status==='منتظر دیگران').map(recordRow).join(''):empty('پیگیری جامانده‌ای نداری','کارهایی با وضعیت «منتظر دیگران» در اینجا دیده می‌شوند.','users',null))}</div><div>${card('این هفته در یک نگاه',week()+`<div class="separator"></div>`+(events.length?events.map(recordRow).join(''):empty('امروز، تقویمت باز است','برای جلسه یا زمان تمرکزت جا باز کن.','calendar','event')),more('calendar','تقویم'))}${card('روند انجام کارها',`<div class="row" style="justify-content:space-between"><span class="muted" style="font-size:11px">کارهای تکمیل‌شده</span><strong>${fa(done.length)} از ${fa(t.length)}</strong></div><div class="progress"><i style="width:${t.length?done.length/t.length*100:0}%"></i></div><div class="strip">${icon('spark')}حتی یک کار کوچک، یک قدم رو به جلوست.</div>`)}${card('امروز پول بگیر',invoices.filter(r=>r.due&&r.due<=today()).length?invoices.filter(r=>r.due&&r.due<=today()).map(r=>`<div class="record"><div class="grow"><button data-edit="${r.id}">${escape(r.title)}</button><small>${date(r.due)}</small></div><strong>${money(r.amount)}</strong></div>`).join(''):empty('مطالبه سررسیدشده‌ای ثبت نشده','با ثبت فاکتور، پیگیری پرداخت‌ها را منظم کن.','wallet','invoice'),more('finance'))}</div></div>`}

function calendar(){const anchor=new Date(today()+'T12:00:00');anchor.setDate(anchor.getDate()-((anchor.getDay()+1)%7)+calendarOffset*7);const cells=Array.from({length:7},(_,i)=>{const d=new Date(anchor);d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)});const all=active().filter(r=>r.due&&['event','task','personal','action','contract','goal'].includes(r.type));const events=records('event');const conflicts=events.filter((a,i)=>events.some((b,j)=>i!==j&&a.due===b.due&&a.time&&b.time&&a.time<(b.endTime||b.time)&&b.time<(a.endTime||a.time)));return `<div class="toolbar"><button class="btn" data-cal="-1">هفته قبل</button><button class="btn" data-cal="0">امروز</button><button class="btn" data-cal="1">هفته بعد</button><span class="muted">${date(cells[0])} تا ${date(cells[6])}</span><button class="btn primary" data-new="event">${icon('plus')}رویداد جدید</button></div>${conflicts.length?`<div class="notice">تداخل زمانی: ${conflicts.map(r=>escape(r.title)).join('، ')}</div>`:''}<div class="card"><div class="calendargrid">${cells.map(d=>`<div class="calendarcell ${d===today()?'now':''}"><header>${date(d,{weekday:'short'})}</header><small dir="ltr" style="font-size:9px">${d}</small>${all.filter(r=>r.due===d).map(r=>`<button class="event" data-edit="${r.id}">${escape(r.time||'')} ${escape(r.title)}</button>`).join('')}<button class="link" data-day="${d}" aria-label="افزودن رویداد">+</button></div>`).join('')}</div></div>${card('رویدادها و جلسات',events.length?events.sort((a,b)=>String(a.due).localeCompare(b.due)).map(recordRow).join(''):empty('قرار بعدی‌ات را ثبت کن','ساعت، حاضرین و مصوبات را کنار هم بنویس.','calendar','event'))}`}
function entityPage(type){const rs=records(type);return `<div class="toolbar"><button class="btn primary" data-new="${type}">${icon('plus')}ثبت ${types[type][0]}</button>${type==='action'?more('roadmap','۴۰ قابلیت تخصصی در نقشه راه'):''}</div>${card(pageNames[page],rs.length?rs.map(recordRow).join(''):empty(`هنوز ${types[type][0]} ثبت نشده`,'با اولین ثبت، اطلاعات این بخش در داشبورد به هم متصل می‌شوند.',types[type][1],type))}`}
function finance(){const invoices=records('invoice'),expenses=records('expense');return `<div class="toolbar"><button class="btn primary" data-new="invoice">${icon('plus')}فاکتور</button><button class="btn" data-new="expense">هزینه</button><button class="btn" data-new="contract">قرارداد</button><button class="btn" data-action="money">${hideMoney?'نمایش مبالغ':'حالت ارائه؛ پنهان کردن مبالغ'}</button><button class="btn" data-action="csv">${icon('download')}خروجی CSV</button></div><div class="stats">${stat('درآمد وصول‌شده',money(invoices.filter(r=>r.status==='پرداخت‌شده').reduce((s,r)=>s+Number(r.amount||0),0)),'تومان','wallet')}${stat('مطالبات باز',money(invoices.filter(r=>r.status!=='پرداخت‌شده').reduce((s,r)=>s+Number(r.amount||0),0)),'تومان','clock')}${stat('هزینه‌های ثبت‌شده',money(expenses.reduce((s,r)=>s+Number(r.amount||0),0)),'تومان','chart')}${stat('قراردادها',fa(records('contract').length),'قرارداد ثبت‌شده','note')}</div>${card('فاکتورها و مطالبات',invoices.length?`<div class="tablewrap"><table><thead><tr><th>عنوان / مشتری</th><th>مبلغ (تومان)</th><th>سررسید</th><th>سن بدهی</th><th>وضعیت</th><th></th></tr></thead><tbody>${invoices.map(r=>`<tr><td><button data-edit="${r.id}">${escape(r.title)}</button><small>${escape(title(r.link))}</small></td><td>${money(r.amount)}</td><td>${date(r.due)}</td><td>${r.status==='پرداخت‌شده'?'—':r.due?fa(Math.max(0,-daydiff(r.due)))+' روز':'بدون موعد'}</td><td><span class="badge ${due(r)?'red':''}">${escape(r.status)}</span></td><td>${r.status!=='پرداخت‌شده'?`<button class="link" data-paid="${r.id}">ثبت پرداخت</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:empty('مطالباتت را یک‌جا ببین','فاکتور و موعد پرداخت را ثبت کن. مبالغ این بخش به تومان است.','wallet','invoice'))}<div class="grid">${card('هزینه‌ها',expenses.length?expenses.map(recordRow).join(''):empty('هزینه‌ای ثبت نشده','هزینه‌ها را به پروژه مربوط وصل کن.','wallet','expense'))}${card('قراردادها',records('contract').length?records('contract').map(recordRow).join(''):empty('قراردادی ثبت نشده','مبلغ و تعهدات قرارداد را ثبت کن.','note','contract'))}</div>`}
function roadmap(){const fs=FEATURES.filter(f=>(catalogModule===''||f.module===Number(catalogModule))&&(catalogPhase===''||f.phase===Number(catalogPhase))&&(!query||f.title.includes(query)||String(f.id)===query));const selected=Object.values(data.choices).filter(x=>x.selected).length;return `<div class="notice">بانک انتخاب امکانات: ${fa(FEATURES.length)} قابلیت در ۲۵ ماژول. انتخاب یا اولویت‌دهی، وضعیت پیاده‌سازی را تغییر نمی‌دهد. امکانات این فهرست الزاماً فعال نیستند.</div><div class="catalogtop">${['هسته اولیه','منشی خودکار','ابزارهای تخصصی','هوشمندی و رشد','گسترش'].map((n,i)=>`<button class="phase ${catalogPhase==i+1?'active':''}" data-phase="${i+1}"><small>فاز ${fa(i+1)} · ${n}</small><strong>${fa(FEATURES.filter(f=>f.phase===i+1).length)}</strong><small>قابلیت پیشنهادی</small></button>`).join('')}</div><div class="toolbar"><input id="catalogQuery" class="field" placeholder="جستجو در عنوان یا شماره قابلیت…" value="${escape(query)}"><select id="moduleFilter"><option value="">همه ۲۵ ماژول</option>${modules.map((m,i)=>`<option value="${i}" ${catalogModule==i&&catalogModule!==''?'selected':''}>${m[0]}</option>`).join('')}</select><button class="btn" data-action="clearFilters">همه فازها</button><span class="muted" style="font-size:11px">${fa(selected)} انتخاب‌شده</span></div><div class="card tablewrap"><table><thead><tr><th>انتخاب</th><th>کد</th><th>قابلیت</th><th>فاز</th><th>اولویت من</th></tr></thead><tbody>${fs.map(f=>`<tr><td><input type="checkbox" data-feature="${f.id}" ${data.choices[f.id]?.selected?'checked':''} aria-label="انتخاب قابلیت ${f.id}"></td><td>${fa(f.id)}</td><td>${escape(f.title)}<small>${modules[f.module][0]}</small></td><td><span class="badge">${fa(f.phase)}</span></td><td><select data-priority="${f.id}" style="padding:5px;font-size:10px"><option value="">انتخاب…</option>${['ضروری','مفید','بعداً'].map(p=>`<option ${data.choices[f.id]?.priority===p?'selected':''}>${p}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>${!fs.length?empty('موردی پیدا نشد','فیلترها را تغییر بده.','search',null):''}</div>`}
function allModules(){return `<div class="notice">همه حوزه‌های دو فایل در این فهرست و نقشه راه ثبت شده‌اند. بخش‌های متصل به سرویس خارجی تا راه‌اندازی اتصال، غیرفعال‌اند.</div><div class="modulegrid">${modules.map((m,i)=>`<button class="modulecard" data-module="${i}"><div class="row" style="justify-content:space-between">${icon(m[3])}<span class="badge ${modulePage[i]?'':'red'}">${modulePage[i]?'ورود به بخش':'نیازمند اتصال'}</span></div><h3>${m[0]}</h3><small>${fa(m[2]-m[1]+1)} قابلیت در نقشه راه</small></button>`).join('')}</div>`}
function integrations(){return `<div class="notice">این اتصال‌ها هنوز راه‌اندازی نشده‌اند. هیچ پیام، ایمیل یا یادآوری خودکاری ارسال نمی‌شود. فعال‌سازی به حساب سرویس و تنظیمات امن سرور نیاز دارد.</div><div class="modulegrid">${[['ایمیل','Gmail / Outlook','دسته‌بندی، پیش‌نویس و پیگیری'],['ربات تلگرام و بله','Telegram / Bale','ثبت سریع، برنامه روز و یادآوری'],['تقویم متصل','Google / Outlook','همگام‌سازی دوطرفه جلسات'],['دستیار هوش مصنوعی','AI Assistant','خلاصه‌سازی و استخراج کارها'],['موتور اتوماسیون','n8n','اجرای قوانین و گردش کار'],['پرتال مشتری و دانشجو','Client / Student Portal','دسترسی جداگانه به اطلاعات']].map(x=>`<div class="modulecard">${icon('settings')}<h3>${x[0]}</h3><small>${x[1]}</small><p class="subtitle">${x[2]}</p><span class="badge red" style="margin-top:15px">متصل نیست</span></div>`).join('')}</div><div style="margin-top:20px">${more('roadmap','مشاهده تمام نیازمندی‌های اتصال')}</div>`}
function settings(){return `<div class="grid"><div>${card('مالکیت داده‌های من',`<p class="muted" style="font-size:12px">خروجی شامل همه رکوردها، انتخاب‌های نقشه راه و تاریخچه فعالیت‌هاست. فایل خروجی را برای بازیابی نگه دار.</p><div class="toolbar"><button class="btn primary" data-action="export">${icon('download')}خروجی کامل JSON</button><label class="btn">بازیابی از فایل<input id="importFile" type="file" accept="application/json" hidden></label></div><small>بازیابی، اطلاعات فعلی را جایگزین می‌کند و قبل از اجرا تأیید می‌گیرد.</small>`)}${card('شخصی‌سازی',`<div class="toolbar"><button class="btn" data-action="dark">${icon('sun')}حالت روشن / تاریک</button><button class="btn" data-action="money">${hideMoney?'نمایش مبالغ':'پنهان کردن مبالغ'}</button></div><p class="subtitle">میانبرها: Ctrl/⌘ + K برای جستجو و Alt + N برای ثبت سریع.</p>`)}${card('وضعیت امکانات',`<p class="muted" style="font-size:12px">ثبت، ویرایش و اتصال رکوردها، کانبان، برنامه هفتگی، پیگیری مطالبات، اهداف، خروجی داده و بازیابی از سطل زباله در این نسخه فعال‌اند.</p><p class="muted" style="font-size:12px">هوش مصنوعی، ارسال خودکار، همگام‌سازی، فایل‌های پیوست، محاسبات تخصصی مهندسی، پرتال‌ها و بکاپ خودکار دو مکانه هنوز پیاده‌سازی نشده‌اند.</p>${more('integrations','وضعیت اتصال‌ها')}`)}</div><div>${card('منابع طراحی',`<div class="record"><span>${icon('note')}</span><div><h3>proposal.pdf</h3><small>۷ صفحه · اهداف، معماری و نقشه راه ۵ فاز</small></div></div><div class="record"><span>${icon('task')}</span><div><h3>checklist (1).pdf</h3><small>۲۶ صفحه · ۴۰۷ قابلیت · ۲۵ ماژول</small></div></div><p class="subtitle">تاریخ اسناد: ۲ مهر ۱۴۰۵. نسخه حاضر، هسته کاربردی و بانک کامل نیازمندی‌ها را پوشش می‌دهد؛ تمام قابلیت‌های سند فعال نیستند.</p>${more('roadmap','مرور چک‌لیست کامل')}`)}${card('سطل زباله',`<p class="muted">${fa(data.records.filter(r=>r.deleted).length)} رکورد قابل بازیابی</p>${more('trash','باز کردن سطل زباله')}`)}${card('فعالیت‌های اخیر',data.log.slice(0,10).map(l=>`<div class="activity">${escape(l.text)}<small>${new Date(l.at).toLocaleString('fa-IR')}</small></div>`).join('')||'<p class="subtitle">فعالیتی ثبت نشده است.</p>')}</div></div>`}
function reports(){const t=tasks(),done=t.filter(r=>r.status==='انجام‌شده');return `<div class="toolbar"><button class="btn" data-action="csv">${icon('download')}خروجی داده‌ها (CSV)</button><button class="btn" data-action="print">چاپ / ذخیره PDF</button></div><div class="stats">${stat('کارهای انجام‌شده',fa(done.length),'از اطلاعات واقعی ثبت‌شده','check')}${stat('نرخ تکمیل',fa(t.length?Math.round(done.length/t.length*100):0)+'٪','کل کارهای ثبت‌شده','chart')}${stat('کارهای معوق',fa(t.filter(due).length),'نیازمند توجه','clock')}${stat('زمان ثبت‌شده',fa(Math.round(t.reduce((s,r)=>s+Number(r.minutes||0),0))),'دقیقه','clock')}</div>${card('سهم نقش‌ها از کارهای انجام‌شده',roles.slice(1).map(r=>`<div style="margin-bottom:20px"><div class="row" style="justify-content:space-between"><span>${r}</span><small>${fa(done.filter(t=>t.role===r).length)} کار</small></div><div class="progress"><i style="width:${done.length?done.filter(t=>t.role===r).length/done.length*100:0}%"></i></div></div>`).join(''))}`}
function content(){switch(page){case'home':return home();case'tasks':return taskPage();case'calendar':return calendar();case'clients':return entityPage('client');case'finance':return finance();case'safety':return `<div class="notice">این بخش برای ثبت و پیگیری اقدامات ایمنی است. ابزارهای محاسبات LOPA، SIL و تحلیل فنی هنوز فعال نیستند.</div>`+entityPage('action');case'documents':return entityPage('document');case'teaching':return entityPage('course');case'goals':return entityPage('goal');case'modules':return allModules();case'roadmap':return roadmap();case'integrations':return integrations();case'settings':return settings();case'reports':return reports();case'trash':return card('رکوردهای حذف‌شده',data.records.filter(r=>r.deleted).map(r=>`<div class="record"><div class="grow">${escape(r.title)}<small>${types[r.type]?.[0]||r.type}</small></div><button class="btn" data-restore="${r.id}">بازیابی</button></div>`).join('')||empty('سطل زباله خالی است','رکوردهای حذف‌شده از اینجا قابل بازیابی‌اند.','trash',null));default:return types[page]?entityPage(page):allModules()}}
function showModal(html){const m=document.getElementById('modal');m.innerHTML=html;if(!m.open)m.showModal()}
function quick(){showModal(`<div class="modalhead"><h2>چه چیزی می‌خواهی ثبت کنی؟</h2><button class="iconbtn" data-action="close" aria-label="بستن">${icon('close')}</button></div><div class="modulegrid">${Object.entries(types).slice(0,12).map(([t,[n,i]])=>`<button class="modulecard" data-new="${t}">${icon(i)}<h3>${n}</h3></button>`).join('')}</div>`)}
const input=(name,label,val='',type='text',extra='')=>`<label>${label}<input class="field" name="${name}" type="${type}" value="${escape(val)}" ${extra}></label>`;
const select=(name,label,options,val)=>`<label>${label}<select name="${name}">${options.map(o=>`<option ${o===val?'selected':''}>${escape(o)}</option>`).join('')}</select></label>`;
function edit(type,id=null,defaults={}){const r=id?data.records.find(x=>x.id===id):{type,role:role==='همه'?'شرکت':role,status:'انجام‌دادنی',priority:'معمولی',...defaults};if(!r)return;type=r.type;editId=id;const statuses=type==='invoice'?['پرداخت‌نشده','پرداخت‌شده']:type==='client'?['سرنخ','در مذاکره','مشتری فعال','بسته‌شده']:statusNames;const relations=data.records.filter(x=>!x.deleted&&x.id!==id&&['project','client','contract','goal','course'].includes(x.type));showModal(`<div class="modalhead"><div><h2>${id?'ویرایش':'ثبت'} ${types[type][0]}</h2><small>${id?'اطلاعات، ارتباطات و پیگیری‌ها':'یک قدم دیگر به نظم بیشتر'}</small></div><button class="iconbtn" data-action="close" aria-label="بستن">${icon('close')}</button></div><form id="recordForm" data-type="${type}"><div class="formgrid"><label class="full">عنوان<input autofocus required name="title" class="field" maxlength="250" value="${escape(r.title||'')}" placeholder="عنوان واضح و کوتاه…"></label>${select('role','نقش',roles.slice(1),r.role)}${select('status','وضعیت',statuses,r.status)}${input('start','تاریخ شروع (میلادی)',r.start,'date')}${input('due',type==='event'?'تاریخ رویداد (میلادی)':'موعد (میلادی)',r.due,'date')}${type==='event'?input('time','ساعت شروع',r.time,'time')+input('endTime','ساعت پایان',r.endTime,'time'):select('priority','اولویت',['معمولی','بالا','پایین'],r.priority)}<label>مرتبط با<select name="link"><option value="">بدون ارتباط</option>${relations.map(x=>`<option value="${x.id}" ${x.id===r.link?'selected':''}>${escape(x.title)} (${types[x.type][0]})</option>`).join('')}</select></label>${['invoice','expense','contract'].includes(type)?input('amount','مبلغ (تومان)',r.amount,'number','min="0" step="1"'):''}${['client','team','supplier'].includes(type)?input('contact','ایمیل یا شماره تماس',r.contact)+input('company','شرکت / سازمان',r.company):''}${type==='goal'?input('target','مقدار هدف',r.target||100,'number','min="1"')+input('current','مقدار فعلی',r.current||0,'number','min="0"'):''}${type==='action'?input('owner','مسئول اقدام',r.owner)+select('study','نوع مطالعه',['HAZOP','LOPA','PHA','Audit','MOC','PSSR'],r.study):''}${['task','personal','action'].includes(type)?input('minutes','زمان صرف‌شده (دقیقه)',r.minutes||0,'number','min="0"')+input('estimate','زمان برآوردی (دقیقه)',r.estimate||0,'number','min="0"'):''}${input('tags','برچسب‌ها (با ویرگول جدا کن)',r.tags)}${input('url','لینک مرجع یا فایل',r.url,'url')}<label class="full">${type==='event'?'حاضرین، دستور جلسه و صورتجلسه':'یادداشت و جزئیات'}<textarea name="notes" placeholder="نکته‌ها و اطلاعات مرتبط…">${escape(r.notes||'')}</textarea></label>${['task','personal','action','event'].includes(type)?`<label class="full">${type==='event'?'مصوبات جلسه؛ هر مصوبه در یک خط':'چک‌لیست؛ هر مورد در یک خط'}<textarea name="checklist" placeholder="هر مورد را در یک خط بنویس">${escape(r.checklist||'')}</textarea></label>`:''}</div><div class="modalfoot"><div class="row"><button class="btn primary" type="submit">${icon('check')}ذخیره</button><button class="btn" type="button" data-action="close">انصراف</button></div>${id?`<button type="button" class="iconbtn danger" data-delete="${id}" aria-label="انتقال به سطل زباله">${icon('trash')}</button>`:''}</div></form>${id?details(r):''}`)}
function details(r){const linked=data.records.filter(x=>!x.deleted&&x.link===r.id);return `<div class="separator"></div>${r.type==='goal'?`<div class="row"><span>پیشرفت هدف</span><strong>${fa(Math.min(100,Math.round(Number(r.current||0)/Number(r.target||100)*100)))}٪</strong></div><div class="progress"><i style="width:${Math.min(100,Number(r.current||0)/Number(r.target||100)*100)}%"></i></div>`:''}${['task','action','personal'].includes(r.type)?`<div class="toolbar"><button class="btn" data-timer="${r.id}">${icon('clock')}${timerId===r.id?'توقف و ثبت زمان':'شروع تایمر'}</button><span id="timerText" class="muted" style="font-size:11px">${timerId===r.id?'تایمر فعال است؛ این صفحه را باز نگه دار.':'زمان روی همین کار ثبت می‌شود.'}</span></div>`:''}${r.checklist&&r.type!=='event'?r.checklist.split('\n').filter(Boolean).map((s,i)=>`<div class="record"><button class="check ${(r.checkDone||[]).includes(i)?'done':''}" data-sub="${r.id}:${i}" aria-label="تکمیل مورد">${(r.checkDone||[]).includes(i)?icon('check'):''}</button>${escape(s)}</div>`).join(''):''}${r.type==='event'&&r.checklist?`<button class="btn" data-actions="${r.id}">تبدیل مصوبات به کار</button>`:''}${r.url&&/^https?:\/\//i.test(r.url)?`<p><a class="link" href="${escape(r.url)}" target="_blank" rel="noopener noreferrer">باز کردن لینک مرجع ↗</a></p>`:''}<h3 style="margin-top:20px">رکوردهای مرتبط (${fa(linked.length)})</h3>${linked.map(recordRow).join('')||'<p class="subtitle">هنوز رکوردی به این مورد متصل نشده است.</p>'}`}
async function update(id,changes,message='تغییرات ذخیره شد'){const next=clone(),r=next.records.find(x=>x.id===id);if(!r)return false;Object.assign(r,changes,{updated:new Date().toISOString()});audit(next,`${message}: ${r.title}`);return commit(next,message)}
function download(content,name,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportAll(){download(JSON.stringify({format:'daftar-v1',exportedAt:new Date().toISOString(),data},null,2),'daftar-backup-'+today()+'.json','application/json')}
function searchModal(q=''){showModal(`<div class="modalhead"><h2>جستجو در همه اطلاعات</h2><button class="iconbtn" data-action="close" aria-label="بستن">${icon('close')}</button></div><input id="globalQuery" class="field" style="width:100%" placeholder="عنوان، یادداشت، برچسب یا نام مشتری…" autofocus value="${escape(q)}"><div id="searchResults" class="searchresults"></div>`);searchResults(q);setTimeout(()=>document.getElementById('globalQuery')?.focus(),0)}
function searchResults(q){document.getElementById('searchResults').innerHTML=q?data.records.filter(r=>!r.deleted&&[r.title,r.notes,r.tags,r.company,r.contact,title(r.link)].join(' ').toLowerCase().includes(q.toLowerCase())).slice(0,40).map(r=>`<button data-edit="${r.id}">${escape(r.title)}<small>${types[r.type]?.[0]||r.type} · ${escape(r.role)}</small></button>`).join('')||'<p class="muted">نتیجه‌ای پیدا نشد.</p>':'<p class="muted">در تمام نقش‌ها و رکوردها جستجو کن.</p>'}
document.addEventListener('submit',async e=>{if(e.target.id!=='recordForm')return;e.preventDefault();const form=e.target,fields=Object.fromEntries(new FormData(form));fields.title=fields.title.trim();if(!fields.title)return toast('عنوان را وارد کن.');if(fields.start&&fields.due&&fields.start>fields.due)return toast('موعد باید بعد از تاریخ شروع باشد.');if(fields.time&&fields.endTime&&fields.endTime<=fields.time)return toast('ساعت پایان باید بعد از شروع باشد.');const next=clone(),id=editId||crypto.randomUUID(),old=next.records.find(r=>r.id===id);const r={...old,...fields,type:form.dataset.type,id,created:old?.created||new Date().toISOString(),updated:new Date().toISOString()};if(old)next.records[next.records.indexOf(old)]=r;else next.records.push(r);audit(next,`${old?'ویرایش':'ثبت'} ${types[r.type][0]}: ${r.title}`);const b=form.querySelector('[type=submit]');b.disabled=true;const ok=await commit(next,'با موفقیت ذخیره شد');if(ok)document.getElementById('modal').close();else b.disabled=false});
document.addEventListener('click',async e=>{const el=e.target.closest('button,[data-page]');if(!el)return;const d=el.dataset;
 if(d.page)return navigate(d.page);
 if(d.role){setRole(d.role);return}
 if(d.new)return edit(d.new);
 if(d.edit)return edit('',d.edit);
 if(d.view){view=d.view;render();return}
 if(d.day)return edit('event',null,{due:d.day});
 if(d.cal!==undefined){calendarOffset=d.cal==='0'?0:calendarOffset+Number(d.cal);render();return}
 if(d.module!==undefined){const i=Number(d.module);if(modulePage[i])navigate(modulePage[i]);else navigate('integrations');return}
 if(d.phase){catalogPhase=String(d.phase)===String(catalogPhase)?'':d.phase;render();return}
 if(d.toggle){const r=data.records.find(x=>x.id===d.toggle);return update(r.id,{status:r.status==='انجام‌شده'?'انجام‌دادنی':'انجام‌شده'},'وضعیت کار تغییر کرد')}
 if(d.paid)return update(d.paid,{status:'پرداخت‌شده',paidAt:today()},'پرداخت ثبت شد');
 if(d.restore)return update(d.restore,{deleted:false},'رکورد بازیابی شد');
 if(d.delete){if(await update(d.delete,{deleted:true},'به سطل زباله منتقل شد'))document.getElementById('modal').close();return}
 if(d.sub){const [id,i]=d.sub.split(':'),r=data.records.find(x=>x.id===id);let a=r.checkDone||[];a=a.includes(+i)?a.filter(x=>x!==+i):[...a,+i];if(await update(id,{checkDone:a},'چک‌لیست به‌روز شد'))edit('',id);return}
 if(d.actions){const r=data.records.find(x=>x.id===d.actions);if(r.actionsCreated)return toast('مصوبات این جلسه قبلاً به کار تبدیل شده‌اند.');const next=clone();r.checklist.split('\n').filter(s=>s.trim()).forEach(s=>next.records.push({id:crypto.randomUUID(),type:'task',title:s.trim(),role:r.role,status:'انجام‌دادنی',priority:'معمولی',link:r.id,created:new Date().toISOString()}));next.records.find(x=>x.id===r.id).actionsCreated=true;audit(next,'تبدیل مصوبات به کار: '+r.title);if(await commit(next,'مصوبات به کار تبدیل شدند'))edit('',r.id);return}
 if(d.timer){if(timerId&&timerId!==d.timer)return toast('ابتدا تایمر کار قبلی را متوقف کن.');if(timerId){const r=data.records.find(x=>x.id===timerId);const elapsed=(Date.now()-timerStart)/60000;const ok=await update(timerId,{minutes:Math.round((Number(r.minutes||0)+elapsed)*100)/100},'زمان کار ثبت شد');if(ok){timerId=null;clearInterval(timer);edit('',r.id)}}else{timerId=d.timer;timerStart=Date.now();edit('',d.timer);timer=setInterval(()=>{const t=document.getElementById('timerText');if(t)t.textContent='زمان سپری‌شده: '+fa(Math.floor((Date.now()-timerStart)/1000))+' ثانیه'},1000)}return}
 switch(d.action){case'menu':document.getElementById('sidebar').classList.toggle('open');break;case'close':document.getElementById('modal').close();break;case'quick':quick();break;case'search':searchModal();break;case'dark':document.body.classList.toggle('dark');try{localStorage.setItem('daftar-dark',document.body.classList.contains('dark')?'1':'0')}catch{}break;case'money':hideMoney=!hideMoney;render();break;case'clearFilters':catalogPhase='';catalogModule='';query='';render();break;case'export':exportAll();break;case'print':window.print();break;case'csv':{const list=page==='finance'?active().filter(r=>['invoice','expense','contract'].includes(r.type)):active();const safe=x=>'"'+String(x??'').replace(/^[=+@-]/,"'").replace(/"/g,'""')+'"';download('\ufeff'+[['عنوان','نوع','نقش','وضعیت','موعد','مبلغ تومان','زمان دقیقه'],...list.map(r=>[r.title,types[r.type]?.[0],r.role,r.status,r.due,r.amount,r.minutes])].map(row=>row.map(safe).join(',')).join('\r\n'),'daftar-'+today()+'.csv','text/csv;charset=utf-8');break}case'alerts':{const list=active().filter(due);showModal(`<div class="modalhead"><h2>موارد نیازمند توجه</h2><button class="iconbtn" data-action="close" aria-label="بستن">${icon('close')}</button></div>${list.length?list.map(recordRow).join(''):empty('موعد عقب‌افتاده‌ای نداری','هشدارها بر اساس اطلاعات ثبت‌شده محاسبه می‌شوند.','bell',null)}`);break}}
});
document.addEventListener('input',e=>{if(e.target.id==='globalQuery')searchResults(e.target.value);if(e.target.id==='catalogQuery'){query=e.target.value;const pos=e.target.selectionStart;document.getElementById('content').innerHTML=roadmap();const inp=document.getElementById('catalogQuery');inp.focus();inp.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{const el=e.target,d=el.dataset;if(el.id==='statusFilter'){filter=el.value;render()}if(el.id==='moduleFilter'){catalogModule=el.value;render()}if(d.feature||d.priority){const id=d.feature||d.priority,next=clone();next.choices[id]={...(next.choices[id]||{}),...(d.feature?{selected:el.checked}:{priority:el.value})};await commit(next);render()}
 if(el.id==='importFile'){const file=el.files[0];if(!file)return;if(file.size>2000000)return toast('فایل باید کوچک‌تر از ۲ مگابایت باشد.');try{const parsed=JSON.parse(await file.text());const n=parsed.data;const valid=parsed.format==='daftar-v1'&&n&&Array.isArray(n.records)&&n.choices&&Array.isArray(n.log)&&n.records.every(r=>typeof r.title==='string'&&types[r.type]&&typeof r.id==='string'&&/^[a-zA-Z0-9-]+$/.test(r.id)&&(!r.due||/^\d{4}-\d{2}-\d{2}$/.test(r.due)));if(!valid)throw Error('فایل پشتیبان معتبر نیست.');if(confirm('اطلاعات فعلی با '+fa(n.records.length)+' رکورد این فایل جایگزین شود؟ قبل از ادامه می‌توانید از اطلاعات فعلی خروجی بگیرید.'))await commit(n,'اطلاعات بازیابی شد')}catch(e){toast(e.message)}}});
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag]');if(el)e.dataTransfer.setData('text/plain',el.dataset.drag)});document.addEventListener('dragover',e=>{if(e.target.closest('[data-drop]'))e.preventDefault()});document.addEventListener('drop',e=>{const el=e.target.closest('[data-drop]');if(el){e.preventDefault();update(e.dataTransfer.getData('text/plain'),{status:el.dataset.drop},'وضعیت کار تغییر کرد')}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal()}if(e.altKey&&e.key.toLowerCase()==='n'){e.preventDefault();quick()}});
try{if(localStorage.getItem('daftar-dark')==='1')document.body.classList.add('dark')}catch{}
try{const saved=localStorage.getItem('daftar-role');if(roles.includes(saved))role=saved}catch{}
render();load();
</script></body></html>
